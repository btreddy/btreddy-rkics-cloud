name: RkICS Reminders

# Same change as digest.yml — automatic scheduling now happens via
# cron-job.org, not GitHub's own `schedule:` trigger, since it proved
# consistently unreliable for precise daily timing. This workflow is kept
# only for manual testing via the "Run workflow" button.
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Which reminder to send when running manually'
        required: true
        default: 'morning'
        type: choice
        options: [morning, evening]

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder endpoint
        run: curl -X POST "${{ secrets.REMINDERS_URL }}?type=${{ github.event.inputs.type }}"
