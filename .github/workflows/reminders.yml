name: RkICS Reminders

on:
  schedule:
    # 10:00 AM IST — nudge anyone who hasn't checked in yet today
    - cron: '30 4 * * *'
    # 6:30 PM IST — nudge anyone who forgot to check out or send a DPR,
    # with a 2-hour buffer before the 8:30 PM MD/CEO digest so people have
    # time to fix it before MD sees the gap.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Which reminder to send when running manually'
        required: true
        default: 'morning'
        type: choice
        options: [morning, evening]

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Determine reminder type
        id: pick
        run: |
          if [ "${{ github.event.schedule }}" == "30 4 * * *" ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" == "0 13 * * *" ]; then
            echo "type=evening" >> $GITHUB_OUTPUT
          else
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
          fi
      - name: Trigger reminder endpoint
        run: curl -X POST "${{ secrets.REMINDERS_URL }}?type=${{ steps.pick.outputs.type }}"
