name: Daily RkICS Digest

on:
  schedule:
    # 15:07 UTC = 8:37 PM IST. Deliberately 7 minutes off the hour —
    # GitHub's own docs warn that scheduled workflows are more likely to
    # be delayed right at the top of the hour (a platform-wide high-load
    # period), which is what caused the digest to fire nearly 4 hours late
    # on Sept 23 and misreport the wrong calendar day.
    - cron: '7 15 * * *'
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest endpoint
        run: curl -X POST "${{ secrets.DIGEST_URL }}"
