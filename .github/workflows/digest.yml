name: Daily RkICS Digest

# Automatic scheduling now happens via cron-job.org instead of GitHub's own
# `schedule:` trigger — GitHub Actions' free-tier scheduler proved to be
# consistently delayed by 3-4+ hours every single day (confirmed across
# runs #4-7, growing worse each day), which isn't a timing-tweak problem,
# it's a platform reliability limit. cron-job.org is a free service built
# specifically to hit a URL at a precise time and doesn't have this issue.
#
# This workflow is kept only for manual testing (the "Run workflow" button
# in GitHub's Actions tab) — it is NOT what triggers the real daily digest
# anymore.
on:
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest endpoint
        run: curl -X POST "${{ secrets.DIGEST_URL }}"
